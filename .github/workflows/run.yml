name: Run main_resmi.py
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python main_resmi.py
      - uses: actions/upload-artifact@v4
        with:
          name: resmi-gazete
          path: rg/
          if-no-files-found: warn
