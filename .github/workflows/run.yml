name: Run main_resmi.py
on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"   # 04:23 TR — saat başı yoğunluğundan kaçın, 08:15 analistinden önce bitsin
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pymupdf fonttools
      - run: python main_resmi.py
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-tur
      - run: python scripts/rg_reader.py
      - uses: actions/upload-artifact@v4
        with:
          name: resmi-gazete
          path: rg/
          if-no-files-found: warn
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add rg
          git commit -m "Resmi Gazete $(date +%Y%m%d)" || echo "Degisiklik yok"
          git push
