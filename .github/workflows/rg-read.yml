name: Read Resmi Gazete
# İndirme koşusu bitince rg/ içindeki dosyaları okur, rg/YYYYMMDD.json yazar, kaynak dosyaları siler.
on:
  workflow_run:
    workflows: ["Run main_resmi.py"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rg-read
  cancel-in-progress: false
jobs:
  read:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-tur
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rg_reader.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A rg
          git commit -m "RG oku: $(date +%Y%m%d) json, kaynaklar silindi" || echo "Degisiklik yok"
          git push
